name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build:hostinger
        env:
          VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}
          VITE_HOTJAR_ID: ${{ secrets.VITE_HOTJAR_ID }}
          VITE_HOTJAR_SV: ${{ secrets.VITE_HOTJAR_SV || '6' }}
          VITE_BLOG_API_URL: /api/blog.php
          VITE_BLOG_ADMIN_KEY: ${{ secrets.VITE_BLOG_ADMIN_KEY || 'RivereBlog2026!' }}

      - name: Deploy dist to Hostinger public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.analytics-data
            **/.analytics-data/**
            **/.blog-data
            **/.blog-data/**
            **/images/blog-uploads
            **/images/blog-uploads/**
